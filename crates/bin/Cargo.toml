[package]
name = "externalip-manager"
version = "0.6.0"
edition = "2024"
description = "Manage ExternalIP assignments on Kubernetes Services"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env", "string"] }
tokio = { version = "1.53.1", features = ["full"] }
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_32"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing = "0.1.44"
externalip-manager-manager = { path = "../manager" }
